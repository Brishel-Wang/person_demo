[project]
name = "person-demo"
version = "0.1.0"
description = "单路视频人体检索与大模型报告 Demo (spec v1.6.1)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "av>=13",
    "ultralytics>=8.4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    "pymilvus>=2.6,<2.7",
    "transformers>=4.53",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "modelscope>=1.20",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
]

[project.scripts]
project = "person_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/person_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
asyncio_mode = "auto"
